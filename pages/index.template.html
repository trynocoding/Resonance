<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>同频 · ETF 共振看板</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #202a35; background: #f4f6f8; }
    body { max-width: 85rem; margin: auto; padding: 2rem clamp(1rem, 4vw, 3rem); }
    h1 { margin: 0 0 .6rem; font-size: clamp(1.6rem, 4vw, 2.4rem); }
    p, nav { line-height: 1.65; }
    nav { display: flex; flex-wrap: wrap; gap: .5rem 1.5rem; margin: 1.5rem 0; }
    a { color: #164c91; text-underline-offset: .2em; }
    dl { display: flex; flex-wrap: wrap; gap: 1rem 2rem; margin: 1.5rem 0; }
    dt, small, footer { color: #46566a; }
    dd { margin: .25rem 0 0; font-variant-numeric: tabular-nums; }
    .table { overflow-x: auto; border: 1px solid #d9e0e7; border-radius: .65rem; background: white; }
    table { width: 100%; border-collapse: collapse; white-space: nowrap; font-variant-numeric: tabular-nums; }
    th, td { padding: .75rem; border-bottom: 1px solid #e7ecf2; text-align: left; }
    thead { background: #eaf0f6; }
    tbody tr:last-child > * { border-bottom: 0; }
    small { display: block; margin-top: .16rem; font-weight: normal; }
    td span { border-radius: .3rem; padding: .2rem .35rem; }
    .red { color: #8e2622; background: #fbe8e5; }
    .green { color: #155737; background: #e0f2e7; }
    .gray { color: #455365; background: #eaf0f6; }
    footer { margin-top: 1rem; }
  </style>
</head>
<body>
  <header>
    <h1>同频 · ETF 共振看板</h1>
    <p>盘后快照。红灯表示风险，绿灯表示机会，灰灯表示该指标未亮灯。ETF 份额、融资与行情的披露时间可能不同。</p>
    <nav aria-label="数据与相关项目">
      <a href="resonance.json">Agent 数据 JSON</a>
      <a href="https://trynocoding.github.io/etf-radar/">ETF 雷达</a>
      <a href="https://trynocoding.github.io/national-team-etf-flow/">国家队 ETF 流向</a>
    </nav>
  </header>
  <main>
    <dl>
      <div><dt>更新时间</dt><dd>$generated_at</dd></div>
      <div><dt>目标交易日</dt><dd>$target_date</dd></div>
      <div><dt>最新两市成交额</dt><dd>$turnover_date</dd></div>
      <div><dt>最新融资余额</dt><dd>$margin_date</dd></div>
    </dl>
    <div class="table" role="region" aria-label="ETF 五灯共振" tabindex="0">
      <table>
        <thead><tr>
          <th scope="col">ETF</th><th scope="col">共振日期</th><th scope="col">行情日期</th>
          <th scope="col">份额日期</th><th scope="col">共振判定</th><th scope="col">价格位置</th>
          <th scope="col">份额流向</th><th scope="col">吸筹/出货</th><th scope="col">成交额热度</th>
          <th scope="col">融资杠杆</th>
        </tr></thead>
        <tbody>$rows</tbody>
      </table>
    </div>
  </main>
  <footer>信号按上游共振算法计算。<a href="https://github.com/OrangesHuang/Resonance">Resonance 源项目</a></footer>
</body>
</html>
