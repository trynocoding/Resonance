name: 发布 Resonance 服务器数据到 GitHub Pages

on:
  workflow_dispatch:
  schedule:
    # 在服务器导出任务之后发布，时间为北京时间 16:33、21:53、次日 10:33。
    - cron: '33 8 * * 1-5'
    - cron: '53 13 * * 1-5'
    - cron: '33 2 * * 2-6'

concurrency:
  group: resonance-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: 读取服务器数据分支
        uses: actions/checkout@v6
        with:
          ref: resonance-data
          path: server-snapshot
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 生成静态看板
        run: python pages/render_site.py server-snapshot/resonance.json _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
